# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Do not run `ultracite fix` here. Inherited UI trips hundreds of style rules;
# CI is Go tests, `bun run check-types`, and Compose config (see CONTRIBUTING.md).

pre-commit:
  parallel: true
  jobs:
    - name: skip-ultracite
      run: "true"
