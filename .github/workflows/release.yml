name: Release

# Manual: git tag v0.1.0 && git push origin v0.1.0
# Tags are not auto-bumped. CI on the tag must pass before the GitHub Release is created.

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci

  github-release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
