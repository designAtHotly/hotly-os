metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
compression_level = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# Overridden by GARAGE_RPC_SECRET in Compose. Local-dev placeholder only.
rpc_secret = "163e27aac542a7758542ee7610780425cb1960d07e366462f6826a866aae5475"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.internal"

# Website and admin APIs stay on loopback. Compose does not publish 3900/3902/3903.
[s3_web]
bind_addr = "127.0.0.1:3902"
root_domain = ".web.garage.internal"
index = "index.html"

[admin]
api_bind_addr = "127.0.0.1:3903"
